<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nghị trường số</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a learning game for civil servants and citizens, proud and festive, never childish
   IDEA the face of a Đông Sơn bronze drum, and a journey down the Mã river through five Thanh Hóa landmarks
   PICTURE Hàm Rồng at dusk, a bronze drum rising as the sun with flying Lạc birds, the Voi Đồng mascot on the bank
   COLOUR deep verdigris patina ground, bronze gold, đỏ son accent, ivory text, river teal
   TYPE Chakra Petch 700 (engraved, angular) + Be Vietnam Pro
   LAYOUT one phone column (max 480px): header, scrolling stage, bottom nav; on wide screens a framed column over a drum field */
:root{--bg:#0a221f;--bg2:#0f2e2a;--panel:#143a34;--panel2:#1a463f;--line:#2e5f55;--gold:#d9a441;--gold2:#f3d48a;--red:#c43a2e;--ivory:#f8f0de;--mute:#b5c7bc;--ok:#72d3a2;--bad:#ff8f7f;--river:#4f9a8f;--disp:"Chakra Petch","Be Vietnam Pro",system-ui,sans-serif;color-scheme:dark}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ivory);font:16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.bgart{position:fixed;inset:0;width:100%;height:100%;opacity:.18;pointer-events:none}
.app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg2);overflow:hidden}
@media(min-width:520px){.app{box-shadow:0 0 0 1px #3d6e62,0 0 0 6px #0a221f,0 0 0 7px #8a6a2f}}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:#0a221f;border-bottom:1px solid var(--line)}
.top .who{flex:1;display:grid;gap:3px}
.nm{font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{font-size:13px;color:var(--gold2);line-height:1.2}
.xpbar{height:6px;border-radius:3px;background:#24524a;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.streak{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--gold2);white-space:nowrap}
.streak svg{width:22px;height:22px;fill:var(--red)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:20px;-webkit-overflow-scrolling:touch}
.bot{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#0a221f;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bot button{background:none;border:0;padding:0 2px;white-space:nowrap;min-height:58px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:13px;line-height:1.1;color:var(--mute)}
.bot svg,.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bot button[aria-current=page]{color:var(--gold2)}
.pad{padding-left:16px;padding-right:16px}
h1,h2,h3{font-family:var(--disp);line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,9vw,42px);color:var(--gold2)}
h2{font-size:22px;margin-bottom:10px}
h3{font-size:18px}
.sub{color:var(--mute);margin:6px 0 0;font-size:15px}
.hero{position:relative;height:clamp(210px,38vh,300px);margin-top:12px}
.hero svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.spin{transform-box:view-box;animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.toast,.ans,.btn{transition:none!important}.shake{animation:none!important}}
.cta{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;margin-top:12px}
.sec{margin:22px 16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:6px 16px;border-radius:12px;border:0;background:linear-gradient(#f0c662,#d39b36);color:#1d1205;font-weight:700;line-height:1.2;text-align:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn.sm{min-height:44px;padding:4px 14px;font-size:15px}
.btn.ghost{background:transparent;color:var(--gold2);box-shadow:inset 0 0 0 1.5px var(--gold)}
.btn.red{background:linear-gradient(#d9503f,#b2342a);color:#fff}
.btn.full{width:100%}
.lab{font-size:13px;color:var(--mute)}
.indtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font-family:var(--disp);font-size:clamp(40px,12vw,52px);font-weight:700;color:var(--gold2);line-height:1}
.goal{text-align:right;font-size:13px;color:var(--mute);line-height:1.2}
.goal b{display:block;font-family:var(--disp);font-size:24px;color:var(--ivory)}
.track{position:relative;height:14px;border-radius:7px;background:#24524a;margin-top:14px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,var(--river),var(--gold2))}
.track b{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;border-radius:2px;background:var(--red)}
.track b.ten{background:var(--ivory);opacity:.6}
.scale{position:relative;height:20px;margin-top:4px;font-size:13px;color:var(--mute)}
.scale span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.scale span:first-child{transform:none}
.scale span:last-child{transform:translateX(-100%)}
.rows{display:grid;gap:8px;margin-top:12px}
.row{display:grid;grid-template-columns:9.2em minmax(0,1fr) 2.2em;gap:10px;align-items:center;font-size:14px}
.bar{height:8px;border-radius:4px;background:#24524a;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.row b{text-align:right;font-variant-numeric:tabular-nums}
.hint{margin:12px 0 0;font-size:14px;color:var(--mute)}
.dl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.dl:first-child{border-top:0;padding-top:0}
.dl:last-child{padding-bottom:0}
.dl i{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--gold);display:grid;place-items:center}
.dl.done i{background:var(--ok);box-shadow:none}
.dl.done span{color:var(--mute);text-decoration:line-through}
.dl b{color:var(--gold2);font-size:14px;white-space:nowrap}
.stations{position:relative;display:grid;gap:14px}
.stations::before{content:"";position:absolute;left:30px;top:30px;bottom:30px;width:6px;border-radius:3px;background:linear-gradient(var(--river),#7fb8a8 50%,var(--gold))}
.st{display:grid;grid-template-columns:66px minmax(0,1fr);gap:12px;align-items:center}
.med{position:relative;z-index:1;width:66px;height:66px;border-radius:50%;background:radial-gradient(#1f5249,#0b2522);box-shadow:0 0 0 2px var(--gold),0 0 0 5px var(--bg2),0 0 0 6px #6d5326;display:grid;place-items:center}
.med svg{width:46px;height:46px}
.st.lock .med{opacity:.45}
.stc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.tp{font-size:14px;color:var(--mute);margin-top:3px;line-height:1.3}
.stars{display:flex;gap:4px;align-items:center;margin-top:6px}
.stars svg{width:18px;height:18px}
.stars span{font-size:13px;color:var(--mute);margin-left:4px}
.lk{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
.lk svg{width:16px;height:16px}
.note{font-size:13px;color:var(--mute);margin:22px 16px 0;line-height:1.5}
.ov{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:var(--bg2)}
.ov.on{display:flex}
.ovh{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:#0a221f}
.ovh .t{flex:1;font-weight:700;line-height:1.2}
.ovh .qc{font-family:var(--disp);font-weight:700;color:var(--gold2);white-space:nowrap}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
.ovb{flex:1;overflow-y:auto;padding:14px 16px 28px}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:6px;border-radius:3px;background:#2a564d}
.dots i.ok{background:var(--ok)}
.dots i.bad{background:var(--bad)}
.dots i.cur{background:var(--gold2)}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;line-height:1.2}
.chip b{display:block;font-family:var(--disp);font-size:18px;color:var(--gold2)}
.chip span{font-size:13px;color:var(--mute)}
.qcard{position:relative;background:linear-gradient(160deg,#1d4c44,#123630);border:1px solid #3c7064;border-radius:18px;padding:18px;overflow:hidden}
.qcard .wm{position:absolute;right:-28px;top:-24px;width:150px;height:150px;opacity:.13}
.qcard p{position:relative;font-size:18px;font-weight:600;margin:0;line-height:1.4}
.qn{position:relative;font-size:13px;color:var(--gold2);margin-bottom:6px}
.answers{display:grid;gap:10px;margin-top:14px}
.ans{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;text-align:left;min-height:54px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);line-height:1.35;transition:background .15s}
.ans .k{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:700;background:#0f2e2a;box-shadow:0 0 0 1.5px var(--gold);color:var(--gold2)}
.ans.ok{border-color:var(--ok);background:#1f5644}
.ans.ok .k{background:var(--ok);color:#06231a;box-shadow:none}
.ans.bad{border-color:var(--bad);background:#5a2a25}
.ans.bad .k{background:var(--bad);color:#2a0b07;box-shadow:none}
.ans[disabled]{cursor:default}
.fb{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:end;margin-top:16px}
.bubble{background:var(--ivory);color:#1f1a10;border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:15px;line-height:1.45}
.bubble b{display:block;margin-bottom:4px;font-size:16px}
.bubble .cc{display:block;margin-top:6px;font-size:13px;color:#5d4b26}
.mt{margin-top:14px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.res{display:grid;gap:12px;justify-items:center;text-align:center}
.medal{width:170px;height:170px}
.res .stars svg{width:34px;height:34px}
.gain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;line-height:1.25}
.stat b{display:block;font-family:var(--disp);font-size:21px;color:var(--gold2);white-space:nowrap}
.stat span{font-size:13px;color:var(--mute)}
.btns{display:grid;gap:10px;width:100%}
.arena-art{position:relative;width:min(240px,64vw);aspect-ratio:1;margin:14px auto 0}
.arena-art svg{width:100%;height:100%}
.arena-art div{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:44px;color:var(--gold2)}
.rules{margin:10px 0 0;padding-left:20px;display:grid;gap:4px}
.ahud{display:grid;grid-template-columns:minmax(0,1fr) 108px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:12px}
.ahud .s{font-family:var(--disp);font-size:28px;font-weight:700;line-height:1.1}
.ring{position:relative;width:108px;height:108px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:32px;font-weight:700;color:var(--gold2)}
.combo{color:#ff9a8a;text-align:right}
.game{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:start}
.game .med svg{width:40px;height:40px;stroke:var(--gold2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.game p{margin:6px 0 10px;color:var(--mute);font-size:15px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tqcard{background:var(--ivory);color:#1f1a10;border-radius:18px;padding:22px 18px;font-size:19px;font-weight:600;line-height:1.35;text-align:center;min-height:132px;display:grid;place-items:center;box-shadow:0 6px 0 #b98f45;margin-top:12px}
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.bin{min-height:78px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;align-content:center;gap:2px;font-weight:700;padding:8px;text-align:center;line-height:1.2}
.bin small{font-weight:400;color:var(--mute);font-size:13px}
.bin.ok{border-color:var(--ok);background:#1f5644}
.bin.bad{border-color:var(--bad);background:#5a2a25}
.placed{display:grid;gap:8px;margin-top:12px}
.placed div{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#1f5644;border:1px solid var(--ok);line-height:1.35}
.placed em{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#06231a;font-weight:700}
.pool{display:grid;gap:8px;margin-top:14px}
.step{text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:1.5px dashed var(--gold);background:var(--panel2);line-height:1.35}
.rk{display:grid;gap:14px}
.rr{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center}
.rr .n{font-size:15px;line-height:1.3}
.rr .bar{height:10px;border-radius:5px;margin-top:6px}
.rr.me .bar i{background:var(--red)}
.rr .p{font-family:var(--disp);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#0f2e2a;box-shadow:0 0 0 1.5px var(--gold);font-weight:700;font-size:14px}
.rr.me .pos{background:var(--red);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bdg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.bd{display:grid;justify-items:center;gap:6px;text-align:center;font-size:13px;line-height:1.25}
.bd .m{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#f0c662,#9a6524);box-shadow:inset 0 0 0 2px #f6dc98}
.bd .m svg{width:34px;height:34px;fill:none;stroke:#2a1806;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bd.off{color:var(--mute)}
.bd.off .m{background:#183b35;box-shadow:inset 0 0 0 1.5px #3c6a60}
.bd.off .m svg{opacity:.4;stroke:var(--mute)}
.prof{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;align-items:center}
label{font-size:14px;color:var(--mute);display:block;margin:12px 0 4px}
input[type=text],select{width:100%;min-height:48px;font-size:16px;padding:0 12px;border-radius:12px;border:1px solid #4a7a6e;background:#0c2723;color:var(--ivory)}
.modal{position:absolute;inset:0;z-index:30;background:rgba(5,18,16,.88);display:none;align-items:flex-end}
.modal.on{display:flex}
.sheet{width:100%;max-height:100%;overflow-y:auto;background:var(--bg2);border-top:2px solid var(--gold);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.role{display:grid;justify-items:center;gap:6px;padding:12px 8px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:center}
.role[aria-pressed=true]{border-color:var(--gold2);background:#24544a;box-shadow:inset 0 0 0 2px var(--gold)}
.role b{font-size:15px;line-height:1.25}
.role small{font-size:13px;color:var(--mute);line-height:1.3}
.toast{position:absolute;left:50%;bottom:78px;transform:translate(-50%,16px);opacity:0;background:var(--ivory);color:#1f1a10;padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;z-index:40;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 0 #b98f45}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.cta{grid-template-columns:1fr}.row{grid-template-columns:7.6em minmax(0,1fr) 2.2em}.bdg{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a221f"/><stop offset=".5" stop-color="#1d4a42"/><stop offset=".82" stop-color="#9a7a3c"/><stop offset="1" stop-color="#d8a24a"/></linearGradient>
<radialGradient id="gDrum" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#ffe7a6"/><stop offset=".5" stop-color="#dca54c"/><stop offset="1" stop-color="#94591f"/></radialGradient>
<linearGradient id="gRiver" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f8a80"/><stop offset=".6" stop-color="#8fc4b0"/><stop offset="1" stop-color="#f0cf80"/></linearGradient>
<linearGradient id="gEle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2ad58"/><stop offset="1" stop-color="#9a5f25"/></linearGradient>
</defs>
</svg>
<svg class="bgart" id="bgart" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="bot" id="nav" aria-label="Điều hướng chính"></nav>
  <section class="ov" id="ov" aria-live="polite"><div class="ovh" id="ovh"></div><div class="ovb" id="ovb"></div></section>
  <div class="modal" id="onb" role="dialog" aria-modal="true" aria-labelledby="onbT"><div class="sheet" id="onbS"></div></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Number(n).toLocaleString('vi-VN');
const pct=g=>g.toFixed(1).replace('.',',')+'%';
const p2=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>dkey(new Date());
const yday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dkey(d)};
const wkey=()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return dkey(d)};

/* ---------- Nội dung ---------- */
const ROLES=[
 {id:'tinh',n:'Đại biểu HĐND tỉnh',d:'Quyết sách tầm tỉnh, thẩm tra, chất vấn'},
 {id:'xa',n:'Đại biểu HĐND xã',d:'Sát dân, gần dân, giám sát tại cơ sở'},
 {id:'cv',n:'Chuyên viên tham mưu',d:'Chuẩn bị kỳ họp, soạn thảo, tổng hợp'},
 {id:'dan',n:'Cử tri, doanh nhân',d:'Tìm hiểu bộ máy và chỉ tiêu của tỉnh'}];

const f1=n=>n.toFixed(1);
function drum(cx,cy,r,spin){
 let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#gDrum)"/><circle cx="${cx}" cy="${cy}" r="${f1(r-1)}" fill="none" stroke="#f6dc98" stroke-width="1.2" opacity=".8"/>`;
 [.9,.8,.62,.5,.36].forEach(k=>{s+=`<circle cx="${cx}" cy="${cy}" r="${f1(r*k)}" fill="none" stroke="#6e4116" stroke-width="${(r/80).toFixed(2)}" opacity=".75"/>`});
 let t='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,c=Math.cos(a),n=Math.sin(a);t+=`M${f1(cx+c*r*.81)},${f1(cy+n*r*.81)}L${f1(cx+c*r*.89)},${f1(cy+n*r*.89)}`}
 s+=`<path d="${t}" stroke="#6e4116" stroke-width="${(r/70).toFixed(2)}" opacity=".8"/>`;
 let d='';for(let i=0;i<36;i++){const a=i*10*Math.PI/180;d+=`<circle cx="${f1(cx+Math.cos(a)*r*.43)}" cy="${f1(cy+Math.sin(a)*r*.43)}" r="${(r*.018).toFixed(2)}"/>`}
 s+=`<g fill="#6e4116">${d}</g>`;
 let b='';const R=r*.71,sc=(r/90).toFixed(3);for(let i=0;i<6;i++){const a=i*60*Math.PI/180;b+=`<g transform="translate(${f1(cx+Math.cos(a)*R)},${f1(cy+Math.sin(a)*R)}) rotate(${i*60-90}) scale(${sc})"><path d="${BIRD}"/></g>`}
 s+=`<g class="${spin?'spin':''}" style="transform-origin:${cx}px ${cy}px" fill="#6e4116" stroke="#6e4116" stroke-width="1.2" stroke-linecap="round">${b}</g>`;
 let p='';for(let i=0;i<28;i++){const a=i*Math.PI/14-Math.PI/2,rr=i%2?r*.1:r*.28;p+=`${f1(cx+Math.cos(a)*rr)},${f1(cy+Math.sin(a)*rr)} `}
 s+=`<polygon points="${p}" fill="#fff1c4"/><circle cx="${cx}" cy="${cy}" r="${f1(r*.08)}" fill="#e0a94e"/>`;
 return s;
}

const KEY='nghitruongso-v1';
const fresh=()=>({name:'',role:'',team:'',xp:0,qok:[],stageBest:{},badges:[],streak:0,last:'',daily:{d:'',done:{}},week:{k:'',xp:0},arenaBest:0,arenaPlays:0,tqBest:0,qtBest:{},answered:0,correct:0});
let S=fresh(),tab='map',run=null,onb=null,confirmReset=false;
function load(){try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw))}catch(e){S=fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function level(xp){let i=0;LEVELS.forEach((l,k)=>{if(xp>=l[0])i=k});const cur=LEVELS[i][0],nx=LEVELS[i+1]?LEVELS[i+1][0]:null;return{i,name:LEVELS[i][1],p:nx?Math.round((xp-cur)/(nx-cur)*100):100,nx}}
function indicators(extra){
 const ok=new Set(S.qok.concat(extra||[]));let n=0;const tg={ns:[0,0],hl:[0,0],kc:[0,0]};
 STAGES.forEach(st=>st.qs.forEach(q=>{const y=ok.has(q.id);if(y)n++;tg[q.tag][1]++;if(y)tg[q.tag][0]++}));
 const v=k=>Math.round(40+60*tg[k][0]/tg[k][1]);
 return{grdp:7.2+0.15*n,ns:v('ns'),hl:v('hl'),kc:v('kc')};
}
const unlocked=i=>i===0||(S.stageBest[STAGES[i-1].id]||0)>=3;
const starsOf=ok=>ok>=6?3:ok>=4?2:ok>=3?1:0;
function nextStage(){for(let i=0;i<STAGES.length;i++)if(unlocked(i)&&(S.stageBest[STAGES[i].id]||0)<4)return i;for(let i=0;i<STAGES.length;i++)if(unlocked(i)&&(S.stageBest[STAGES[i].id]||0)<6)return i;return -1}
function ensureDaily(){if(S.daily.d!==today())S.daily={d:today(),done:{}}}
function ensureWeek(){if(S.week.k!==wkey())S.week={k:wkey(),xp:0}}

/* ---------- Thông báo ---------- */
const tq=[];let tbusy=false;
function toast(m){tq.push(m);if(!tbusy)nextToast()}
function nextToast(){const m=tq.shift();const el=$('#toast');if(!m){tbusy=false;return}tbusy=true;el.textContent=m;el.classList.add('on');setTimeout(()=>{el.classList.remove('on');setTimeout(nextToast,260)},1700)}
function addXP(n){if(n<=0)return;ensureWeek();const b=level(S.xp).i;S.xp+=n;S.week.xp+=n;const a=level(S.xp).i;if(a>b)toast('Lên cấp: '+LEVELS[a][1]);save();renderTop()}
function award(id){if(S.badges.includes(id))return;S.badges.push(id);const b=BADGES.find(x=>x.id===id);toast('Huy hiệu mới: '+b.n);save()}
function touchStreak(){const t=today();if(S.last===t)return;S.streak=S.last===yday()?S.streak+1:1;S.last=t;if(S.streak>=3)award('chuyencan');save();renderTop()}
function daily(id){ensureDaily();if(S.daily.done[id])return;S.daily.done[id]=true;const t=DAILY.find(x=>x.id===id);toast('Xong nhiệm vụ: +'+t.xp+' XP');addXP(t.xp)}

function render(){renderTop();renderNav();const m=$('#main');m.innerHTML=({map:tabMap,arena:tabArena,mini:tabMini,rank:tabRank,me:tabMe})[tab]();bindMe()}

function indCard(ind){
 const pos=g=>Math.max(0,Math.min(100,(g-6)/6*100));

 <div class="track"><i style="width:${pos(ind.grdp)}%"></i><b class="ten" style="left:${pos(10)}%"></b><b style="left:${pos(11)}%"></b></div>
 <div class="scale"><span style="left:0">6%</span><span style="left:${pos(10)}%">10%</span><span style="left:100%">12%</span></div>
 <div class="rows">${[['ns','Ngân sách'],['hl','Hài lòng cử tri'],['kc','Kỷ cương pháp luật']].map(([k,n])=>`<div class="row"><span>${n}</span><div class="bar"><i style="width:${ind[k]}%"></i></div><b>${ind[k]}</b></div>`).join('')}</div>

}

  return `<div class="st ${un?'':'lock'}"><div class="med"><svg viewBox="0 0 48 48" aria-hidden="true">${ICON[s.ico]}</svg></div><div class="stc"><div><h3>${s.n}</h3><div class="tp">${s.t}</div><div class="stars">${[0,1,2].map(k=>star(k<starsOf(best))).join('')}<span>${best}/6</span></div></div>${un?`<button class="btn sm ${best?'ghost':''}" data-act="stage" data-v="${i}">${best?'Chơi lại':'Chơi'}</button>`:`<span class="lk">${LOCK}Mở khi đạt 3/6 ở chặng trước</span>`}</div></div>`};
 return `<div class="pad" style="padding-top:16px"><h1>Nghị trường số</h1><p class="sub">Hành trình Đại biểu HĐND hai cấp tỉnh Thanh Hóa</p></div>
 <div class="hero">${heroSVG()}</div>
 <div class="cta pad">${nx>=0?`<button class="btn" data-act="stage" data-v="${nx}">Chơi chặng ${STAGES[nx].n}</button>`:`<button class="btn" data-act="tab" data-v="arena">Vào Đấu trường</button>`}<button class="btn ghost" data-act="arena-start">Đấu trường 60 giây</button></div>
 <section class="sec"><h2>Tỉnh ảo của bạn</h2>${indCard(ind)}</section>
 <section class="sec"><h2>Nhiệm vụ hôm nay</h2><div class="card">${DAILY.map(t=>{const d=S.daily.done[t.id];return `<div class="dl ${d?'done':''}"><i>${d?CHECK:''}</i><span>${t.n}</span><b>+${t.xp} XP</b></div>`}).join('')}</div></section>
 <section class="sec"><h2>Hành trình dọc sông Mã</h2><div class="stations">${STAGES.map(st).join('')}</div></section>
 <p class="note">Bản demo. Bộ câu hỏi mẫu cần được Phòng Công tác HĐND rà soát trước khi phát hành. Căn cứ: Luật 72/2025/QH15, Luật 121/2025/QH15, NQ 103, 104, 106, 114, 116/2025/UBTVQH15, Chỉ thị 14/CT-TTg; số liệu KT-XH Thanh Hóa cập nhật đến 11/2026.</p>`;
}

const ov=$('#ov');
function openOv(){ov.classList.add('on');renderOv()}

function head(t,right){$('#ovh').innerHTML=`<button class="x" data-act="close" aria-label="Đóng">${XI}</button><div class="t">${t}</div><div class="qc">${right||''}</div>`}
function ansBtns(q,ord,picked,act){return `<div class="answers">${ord.map((oi,k)=>{let c='';if(picked!=null){if(oi===q.c)c='ok';else if(oi===picked)c='bad'}return `<button class="ans ${c}" data-act="${act}" data-v="${oi}" ${picked!=null?'disabled':''}><span class="k">${'ABCD'[k]}</span><span>${q.a[oi]}</span></button>`}).join('')}</div>`}
function fb(ok,text,cc){return `<div class="fb">${voi(76)}<div class="bubble"><b>${ok?'Chính xác!':'Chưa đúng.'}</b>${text}${cc?`<span class="cc">Căn cứ: ${cc}</span>`:''}</div></div>`}
const toEnd=()=>requestAnimationFrame(()=>{const b=$('#ovb');b.scrollTo({top:b.scrollHeight,behavior:'smooth'})});

function renderOv(){
 if(!run)return;const b=$('#ovb');
 if(run.type==='stage'){
  const st=run.st,q=st.qs[run.i],p=run.picked,ind=indicators(run.okIds);
  head('Chặng '+st.n,(run.i+1)+'/6');
  b.innerHTML=`<div class="dots">${st.qs.map((x,k)=>`<i class="${k<run.res.length?(run.res[k]?'ok':'bad'):k===run.i?'cur':''}"></i>`).join('')}</div>
  <div class="chips"><div class="chip"><b>${pct(ind.grdp)}</b><span>GRDP</span></div><div class="chip"><b>${ind.ns}</b><span>Ngân sách</span></div><div class="chip"><b>${ind.hl}</b><span>Cử tri</span></div><div class="chip"><b>${ind.kc}</b><span>Kỷ cương</span></div></div>
  <div class="qcard"><svg class="wm" viewBox="0 0 48 48" aria-hidden="true">${ICON[st.ico]}</svg><div class="qn">${st.t}</div><p>${q.q}</p></div>
  ${ansBtns(q,run.ord[run.i],p,'ans')}
  ${p!=null?fb(p===q.c,(p===q.c?'':'Đáp án đúng: '+q.a[q.c]+'. ')+q.why,q.cc)+`<button class="btn full mt" data-act="next">${run.i<5?'Câu tiếp theo':'Xem kết quả'}</button>`:''}`;
 }else if(run.type==='result'){
  const st=run.st,s=starsOf(run.ok),nx=run.idx+1<STAGES.length&&unlocked(run.idx+1)?run.idx+1:-1;
  const msg=run.ok===6?'Xuất sắc! Nắm chắc toàn bộ nội dung chặng.':run.ok>=4?'Tốt lắm. Chơi lại để đạt trọn 6/6.':run.ok>=3?'Đã mở chặng tiếp theo. Xem lại phần giải thích để chắc hơn.':'Cần đạt 3/6 để mở chặng tiếp theo. Thử lại nhé!';
  head('Kết quả chặng '+st.n,'');
  b.innerHTML=`<div class="res"><svg class="medal" viewBox="0 0 180 180" aria-hidden="true">${drum(90,90,86,false)}<circle cx="90" cy="90" r="34" fill="#0f2e2a" stroke="#f3d48a" stroke-width="2"/><g transform="translate(66,66)">${ICON[st.ico]}</g></svg>
  <div class="stars">${[0,1,2].map(k=>star(k<s)).join('')}</div><h2 style="margin:0">Đúng ${run.ok}/6 câu</h2><p class="sub" style="margin:0">${msg}</p>
  <div class="gain"><div class="stat"><b>+${run.xp}</b><span>XP</span></div><div class="stat"><b>${pct(run.after.grdp)}</b><span>GRDP (trước ${pct(run.before.grdp)})</span></div><div class="stat"><b>${run.after.kc}</b><span>Kỷ cương</span></div></div>
  <div class="btns">${nx>=0?`<button class="btn" data-act="stage" data-v="${nx}">Chặng tiếp: ${STAGES[nx].n}</button>`:''}<button class="btn ghost" data-act="stage" data-v="${run.idx}">Chơi lại chặng này</button><button class="btn ghost" data-act="close">Về bản đồ</button></div></div>`;
 }else if(run.type==='arena'){
  const c=run.cur,mult=run.combo>=5?2:run.combo>=3?1.5:1;
  head('Đấu trường 60 giây','');
  b.innerHTML=`<div class="ahud"><div><div class="lab">Điểm</div><div class="s">${run.score}</div></div><div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="#0f2e2a" stroke="#24524a" stroke-width="9"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="#f3d48a" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="${(326.7*(1-run.left/60000)).toFixed(1)}"/></svg><div id="atm">${Math.ceil(run.left/1000)}</div></div><div><div class="lab" style="text-align:right">Chuỗi</div><div class="s combo">${run.combo}${mult>1?' ×'+String(mult).replace('.',','):''}</div></div></div>
  <div class="qcard ${run.flash==='bad'?'shake':''}"><svg class="wm" viewBox="0 0 200 200" aria-hidden="true">${drum(100,100,96,false)}</svg><div class="qn">Câu ${run.n+1}</div><p>${c.q.q}</p></div>
  ${ansBtns(c.q,c.ord,c.picked,'aans')}`;
 }else if(run.type==='arenaEnd'){
  head('Hết giờ!','');
  b.innerHTML=`<div class="res"><div class="arena-art" style="width:180px"><svg viewBox="0 0 200 200" aria-hidden="true">${drum(100,100,96,false)}<circle cx="100" cy="100" r="44" fill="#0f2e2a" stroke="#f3d48a" stroke-width="2"/></svg><div style="font-size:40px">${run.score}</div></div>
  <h2 style="margin:0">${run.newBest?'Kỷ lục mới!':'Điểm của bạn'}</h2>
  <div class="gain"><div class="stat"><b>${run.ok}/${run.n}</b><span>Câu đúng</span></div><div class="stat"><b>${run.maxc}</b><span>Chuỗi dài nhất</span></div><div class="stat"><b>+${run.xp}</b><span>XP</span></div></div>
  ${run.miss.length?`<div class="card" style="text-align:left;width:100%"><h3>Ôn lại câu sai</h3>${run.miss.slice(0,3).map(q=>`<p style="margin:10px 0 0;font-size:15px"><b>${q.q}</b><br>Đáp án: ${q.a[q.c]}. <span class="lab">${q.cc}</span></p>`).join('')}</div>`:''}
  <div class="btns"><button class="btn" data-act="arena-start">Chơi lại</button><button class="btn ghost" data-act="close">Thoát</button></div></div>`;
 }else if(run.type==='tq'){
  const cd=run.cards[run.i],p=run.picked;
  head('Ai có thẩm quyền?',(run.i+1)+'/8');
  b.innerHTML=`<div class="dots">${run.cards.map((x,k)=>`<i class="${k<run.res.length?(run.res[k]?'ok':'bad'):k===run.i?'cur':''}"></i>`).join('')}</div>
  <div class="tqcard">${cd.t}</div>
  <div class="bins">${BINS.map(x=>{let c='';if(p!=null){if(x.id===cd.b)c='ok';else if(x.id===p)c='bad'}return `<button class="bin ${c}" data-act="tq-bin" data-v="${x.id}" ${p!=null?'disabled':''}>${x.n}<small>${x.s}</small></button>`}).join('')}</div>
  ${p!=null?fb(p===cd.b,(p===cd.b?'':'Thuộc thẩm quyền của '+BINS.find(x=>x.id===cd.b).n+'. ')+cd.why,'')+`<button class="btn full mt" data-act="tq-next">${run.i<7?'Thẻ tiếp theo':'Xem kết quả'}</button>`:''}`;
 }else if(run.type==='tqEnd'){
  head('Kết quả','');
  b.innerHTML=`<div class="res">${voi(150)}<h2 style="margin:0">Đúng ${run.ok}/8 thẻ</h2><p class="sub" style="margin:0">${run.ok===8?'Nắm chắc thẩm quyền của từng chủ thể.':'Xem lại các thẻ sai để phân biệt HĐND, Thường trực HĐND và UBND.'}</p><div class="gain"><div class="stat"><b>+${run.xp}</b><span>XP</span></div><div class="stat"><b>${S.tqBest}/8</b><span>Kỷ lục</span></div><div class="stat"><b>${run.ok===8?'Đạt':'Chưa'}</b><span>Huy hiệu</span></div></div><div class="btns"><button class="btn" data-act="tq-start">Chơi lại</button><button class="btn ghost" data-act="close">Thoát</button></div></div>`;
 }else if(run.type==='qt'){
  const P=PROCS[run.p],done=run.placed.length===P.s.length;
  head(P.n,run.placed.length+'/'+P.s.length);
  b.innerHTML=`<p class="sub" style="margin:0">Chạm các bước theo đúng thứ tự từ đầu đến cuối.</p>
  <div class="placed">${run.placed.map(i=>`<div><em>${i+1}</em><span>${P.s[i]}</span></div>`).join('')}</div>
  ${done?`<div class="res mt">${fb(run.mis===0,run.mis===0?'Không sai bước nào.':'Bạn sai '+run.mis+' lần. Hãy nhớ trình tự này.','')}<div class="gain"><div class="stat"><b>+${run.xp}</b><span>XP</span></div><div class="stat"><b>${run.mis}</b><span>Lần sai</span></div><div class="stat"><b>${S.qtBest[run.p]}</b><span>Ít nhất</span></div></div><div class="btns"><button class="btn" data-act="qt-start" data-v="${1-run.p}">Thử quy trình còn lại</button><button class="btn ghost" data-act="close">Thoát</button></div></div>`:`<div class="pool">${run.pool.filter(i=>!run.placed.includes(i)).map(i=>`<button class="step ${run.wrong===i?'shake':''}" data-act="qt-step" data-v="${i}">${P.s[i]}</button>`).join('')}</div><p class="lab mt">Số lần sai: ${run.mis}</p>`}`;
 }
}

/* ---------- Chặng ---------- */
function startStage(i){
 if(!unlocked(i))return;const st=STAGES[i];
 if(run&&run.iv)clearInterval(run.iv);
 run={type:'stage',st,idx:i,i:0,res:[],okIds:[],picked:null,combo:0,xp:0,ord:st.qs.map(q=>shuffle(q.a.map((x,k)=>k))),ind0:indicators()};
 openOv();$('#ovb').scrollTop=0;
}
function answerStage(v){
 if(run.picked!=null)return;const q=run.st.qs[run.i],ok=+v===q.c;run.picked=+v;run.res.push(ok);S.answered++;
 if(ok){S.correct++;run.okIds.push(q.id);run.combo++;let g=S.qok.includes(q.id)?2:10;if(run.combo>=3)g+=5;run.xp+=g;addXP(g);if(run.combo>=5)award('chuoi5')}else run.combo=0;
 save();renderOv();toEnd();
}
function nextStageQ(){
 if(run.i<5){run.i++;run.picked=null;renderOv();$('#ovb').scrollTop=0;return}
 const st=run.st,ok=run.okIds.length,prev=S.stageBest[st.id]||0;
 run.okIds.forEach(id=>{if(!S.qok.includes(id))S.qok.push(id)});
 S.stageBest[st.id]=Math.max(prev,ok);
 let bonus=ok===6&&prev<6?20:0;if(bonus)addXP(bonus);
 const after=indicators();
 if(ok>=4)award(st.id);if(after.grdp>=9.95)award('haiconso');if(after.grdp>=10.95)award('vuotdich');
 touchStreak();daily('stage');save();
 run={type:'result',st,idx:run.idx,ok,xp:run.xp+bonus,before:run.ind0,after};
 renderOv();$('#ovb').scrollTop=0;
}

/* ---------- Đấu trường ---------- */
function pickArena(){if(!run.pool.length)run.pool=shuffle(ALLQ);const q=run.pool.pop();run.cur={q,ord:shuffle(q.a.map((x,k)=>k)),picked:null}}
function startArena(){
 if(run&&run.iv)clearInterval(run.iv);
 run={type:'arena',pool:shuffle(ALLQ),score:0,ok:0,n:0,combo:0,maxc:0,miss:[],left:60000,t0:Date.now(),lock:false,flash:''};
 pickArena();openOv();
 const r=run;r.iv=setInterval(()=>{if(run!==r){clearInterval(r.iv);return}r.left=Math.max(0,60000-(Date.now()-r.t0));const a=document.getElementById('arc'),t=document.getElementById('atm');if(a)a.setAttribute('stroke-dashoffset',(326.7*(1-r.left/60000)).toFixed(1));if(t)t.textContent=Math.ceil(r.left/1000);if(!r.left)endArena()},100);
}
function answerArena(v){
 const r=run;if(r.lock||r.type!=='arena')return;r.lock=true;const q=r.cur.q,ok=+v===q.c;r.cur.picked=+v;r.n++;S.answered++;
 if(ok){S.correct++;r.ok++;r.combo++;r.maxc=Math.max(r.maxc,r.combo);const m=r.combo>=5?2:r.combo>=3?1.5:1;r.score+=Math.round(10*m);r.flash='ok';if(r.combo>=5)award('chuoi5')}else{r.combo=0;r.flash='bad';r.miss.push(q)}
 renderOv();
 setTimeout(()=>{if(run!==r||r.type!=='arena')return;r.lock=false;r.flash='';pickArena();renderOv()},ok?420:900);
}
function endArena(){
 const r=run;clearInterval(r.iv);S.arenaPlays++;const newBest=r.score>S.arenaBest;if(newBest)S.arenaBest=r.score;
 const xp=Math.round(r.score/4);addXP(xp);if(r.ok>=8)award('thantoc');if(r.ok>=5)daily('arena');if(r.n)touchStreak();save();
 run={type:'arenaEnd',score:r.score,ok:r.ok,n:r.n,maxc:r.maxc,miss:r.miss,xp,newBest};renderOv();
}

/* ---------- Mini-game ---------- */
function startTq(){if(run&&run.iv)clearInterval(run.iv);run={type:'tq',cards:shuffle(CARDS),i:0,res:[],picked:null};openOv();$('#ovb').scrollTop=0}
function binTq(v){if(run.picked!=null)return;const ok=v===run.cards[run.i].b;run.picked=v;run.res.push(ok);S.answered++;if(ok)S.correct++;save();renderOv();toEnd()}
function nextTq(){
 if(run.i<7){run.i++;run.picked=null;renderOv();$('#ovb').scrollTop=0;return}
 const ok=run.res.filter(Boolean).length,xp=ok*5;S.tqBest=Math.max(S.tqBest,ok);addXP(xp);if(ok===8)award('thamquyen');daily('mini');touchStreak();save();
 run={type:'tqEnd',ok,xp};renderOv();$('#ovb').scrollTop=0;
}
function startQt(p){if(run&&run.iv)clearInterval(run.iv);run={type:'qt',p:+p,pool:shuffle(PROCS[+p].s.map((x,k)=>k)),placed:[],mis:0,wrong:null,xp:0};openOv();$('#ovb').scrollTop=0}
function stepQt(v){
 const i=+v;if(i===run.placed.length){run.placed.push(i);run.wrong=null}else{run.mis++;run.wrong=i}
 if(run.placed.length===PROCS[run.p].s.length){run.xp=Math.max(5,20-3*run.mis);addXP(run.xp);const b=S.qtBest[run.p];S.qtBest[run.p]=b==null?run.mis:Math.min(b,run.mis);if(run.mis===0)award('quytrinh');daily('mini');touchStreak();save()}
 renderOv();if(run.placed.length===PROCS[run.p].s.length)toEnd();
}

/* ---------- Sự kiện ---------- */
const ACT={
 tab:v=>{tab=v;confirmReset=false;render();$('#main').scrollTop=0},
 stage:v=>startStage(+v),ans:answerStage,next:nextStageQ,close:closeOv,
 'arena-start':startArena,aans:answerArena,
 'tq-start':startTq,'tq-bin':binTq,'tq-next':nextTq,
 'qt-start':startQt,'qt-step':stepQt,
 'onb-open':openOnb,
 'onb-role':v=>{onb.role=v;document.querySelectorAll('.role').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))},
 'onb-done':()=>{S.role=onb.role;S.name=(onb.name||'').trim().slice(0,40)||'Đại biểu mới';S.team=onb.team;save();$('#onb').classList.remove('on');render();toast('Chào mừng '+S.name+'!')},
 reset:()=>{confirmReset=true;render()},
 'reset-no':()=>{confirmReset=false;render()},
 'reset-yes':()=>{S=fresh();confirmReset=false;save();tab='map';render();openOnb()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.v,b)});
document.addEventListener('keydown',e=>{
 if(!run||!ov.classList.contains('on'))return;
 if(e.key==='Escape'){closeOv();return}
 const k='abcd'.indexOf(e.key.toLowerCase());
 if(k>=0&&(run.type==='stage'||run.type==='arena')){const bs=document.querySelectorAll('#ovb .ans');if(bs[k]&&!bs[k].disabled)bs[k].click()}
 if(e.key==='Enter'){const n=document.querySelector('#ovb [data-act="next"],#ovb [data-act="tq-next"]');if(n){e.preventDefault();n.click()}}
});

/* ---------- Khởi động ---------- */
function start(data){
 if(data&&data.S)S=Object.assign(fresh(),data.S);else load();
 $('#bgart').innerHTML=drum(180,260,300,false)+drum(1430,760,340,false);
 render();if(!S.role)openOnb();
}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
}
</script>
</body>
